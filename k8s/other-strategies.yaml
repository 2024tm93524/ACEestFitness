# ─────────────────────────────────────────────────────────────────
# ROLLING UPDATE
#
# How it works:
#   Kubernetes replaces pods one by one with new version
#   maxUnavailable: 1 = only 1 pod down at a time
#   maxSurge: 1       = only 1 extra pod created at a time
#   Zero downtime - some pods always serving traffic
#
# To trigger: kubectl set image deployment/aceest-rolling
#               aceest-fitness=2024tm93524/aceest-fitness:v1.3
# To rollback: kubectl rollout undo deployment/aceest-rolling
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels:
    app: aceest-fitness
    strategy: rolling
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1    # max pods that can be down during update
      maxSurge: 1          # max extra pods created during update
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: rolling
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: rolling
    spec:
      containers:
      - name: aceest-fitness
        image: 2024tm93524/aceest-fitness:latest
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

---
# ─────────────────────────────────────────────────────────────────
# SHADOW DEPLOYMENT
#
# How it works:
#   Real users hit "live" service as normal
#   A copy of every request ALSO goes to "shadow" service
#   Shadow processes requests but responses are DISCARDED
#   Used to test new version under real traffic with zero risk
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  labels:
    app: aceest-fitness
    track: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: shadow
    spec:
      containers:
      - name: aceest-fitness
        image: 2024tm93524/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: SHADOW_MODE
          value: "true"

---
# ─────────────────────────────────────────────────────────────────
# A/B TESTING DEPLOYMENT
#
# How it works:
#   Version A = original UI/feature
#   Version B = new UI/feature being tested
#   Split users by header/cookie/user ID
#   Measure which version performs better
# ─────────────────────────────────────────────────────────────────

# Version A (original)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-version-a
  labels:
    app: aceest-fitness
    version: "A"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: "A"
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: "A"
    spec:
      containers:
      - name: aceest-fitness
        image: 2024tm93524/aceest-fitness:v1.1
        ports:
        - containerPort: 5000

---
# Version B (new feature)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-version-b
  labels:
    app: aceest-fitness
    version: "B"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: "B"
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: "B"
    spec:
      containers:
      - name: aceest-fitness
        image: 2024tm93524/aceest-fitness:latest
        ports:
        - containerPort: 5000
