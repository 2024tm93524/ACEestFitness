# ═══════════════════════════════════════════════════════════════════
# CANARY DEPLOYMENT
# ═══════════════════════════════════════════════════════════════════
#
# WHAT IS IT? (layman explanation)
#   Release new version to a SMALL % of users first.
#   Watch for errors. If fine → roll out to everyone.
#   If errors → delete canary, 80% of users never knew.
#
# TRAFFIC SPLIT:
#   stable = 4 pods → 80% of users get OLD version
#   canary = 1 pod  → 20% of users get NEW version
#
# HOW TO TEST IT (for your screenshots):
#   Step 1: kubectl apply -f k8s/canary.yaml
#   Step 2: kubectl get pods   (see 4 stable + 1 canary)
#   Step 3: Screenshot of pods showing stable x4 and canary x1
#   Step 4: Check canary logs:
#           kubectl logs -l track=canary
#   Step 5: Canary is good → promote to full:
#           kubectl scale deployment aceest-canary --replicas=4
#           kubectl delete deployment aceest-stable
#           Screenshot showing canary now at 4 replicas
#   Step 6: Canary has errors → remove safely:
#           kubectl delete deployment aceest-canary
#           Screenshot showing only stable pods remain
# ═══════════════════════════════════════════════════════════════════

# ── Stable: 4 pods = 80% of traffic ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  labels:
    app: aceest-fitness
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: stable
    spec:
      containers:
      - name: aceest-fitness
        image: aceest-fitness:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000

---
# ── Canary: 1 pod = 20% of traffic ───────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  labels:
    app: aceest-fitness
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary
    spec:
      containers:
      - name: aceest-fitness
        image: aceest-fitness:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000

---
# ── Service: Routes to BOTH stable + canary (80/20 split) ─────────
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
spec:
  selector:
    app: aceest-fitness              # matches ALL pods (stable + canary)
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    nodePort: 30082
  type: NodePort
